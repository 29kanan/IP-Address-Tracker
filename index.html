<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script type="module" src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="script.js" defer></script>
  
  <title>IP Address Tracker</title>

</head>
<body>
  <div class="container rubik-heading">
    <header>
      <h1>IP Address Tracker</h1>
      <div id="search-bar">
        <input type="search" placeholder="Search for any IP address or domain" id="search-inp">
        <button id="search-btn" ><img src="images/icon-arrow.svg" alt="search"></button>
      </div>
    </header>
    
    <div class="info-panel">
      <div class="info-item">
        <span class="label">IP ADDRESS</span>
        <p class="data" id="ip-add">192.212.174.101</p>
      </div>

      <div class="info-item">
        <span class="label">LOCATION</span>
        <p class="data" id="loc">Brooklyn, NY 10001</p>
      </div>

      <div class="info-item">
        <span class="label">TIMEZONE</span>
        <p class="data" id="timezone">UTC -05:00</p>
      </div>

      <div class="info-item">
        <span class="label">ISP</span>
        <p class="data" id="isp">SpaceX Starlink</p>
      </div>
    </div>
    <div id="map"></div>
  </div>
</body>
</html>
